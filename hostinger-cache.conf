# ============================================================
# CASALE DURGONI — regole per Hostinger (Apache/LiteSpeed)
# Il file _headers vale solo per Netlify: su Hostinger le
# intestazioni di cache si impostano qui.
#
# COME SI USA: copiare queste righe in fondo al file .htaccess
# del sito (File Manager di Hostinger, cartella public_html),
# SENZA toccare le righe gia' presenti (es. la password).
#
# Fotogrammi, foto e video non cambiano mai (se cambiano, cambia
# il nome del file): il browser puo' tenerli 30 giorni senza
# nemmeno richiederli. index.html invece va sempre verificato,
# cosi' ogni aggiornamento del sito arriva subito.
# ============================================================

<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType image/webp  "access plus 30 days"
  ExpiresByType image/jpeg  "access plus 30 days"
  ExpiresByType image/png   "access plus 30 days"
  ExpiresByType video/mp4   "access plus 30 days"
  ExpiresByType text/css    "access plus 7 days"
  ExpiresByType application/javascript "access plus 7 days"
</IfModule>

<IfModule mod_headers.c>
  <FilesMatch "\.(webp|jpe?g|png|mp4)$">
    Header set Cache-Control "public, max-age=2592000"
  </FilesMatch>
  <FilesMatch "\.html$">
    Header set Cache-Control "no-cache"
  </FilesMatch>
  # Sicurezza: il sito non puo' essere incorniciato in pagine altrui
  # (clickjacking) e il browser non "indovina" il tipo dei file.
  Header always set Content-Security-Policy "frame-ancestors 'none'"
  Header always set X-Frame-Options "DENY"
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# Compressione del testo (l'HTML pesa ~190 KB, compresso ~45 KB)
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml
</IfModule>
