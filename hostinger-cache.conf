# ============================================================
# CASALE DURGONI — regole per Hostinger (Apache/LiteSpeed)
# Il file _headers vale solo per Netlify: su Hostinger le
# intestazioni di cache si impostano qui.
#
# Fotogrammi e foto non cambiano mai (se cambiano, cambia il
# nome del file): il browser puo' tenerli 30 giorni senza
# nemmeno richiederli. index.html invece va sempre verificato,
# cosi' ogni aggiornamento del sito arriva subito.
# ============================================================

<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType image/webp  "access plus 30 days"
  ExpiresByType image/jpeg  "access plus 30 days"
  ExpiresByType image/png   "access plus 30 days"
  ExpiresByType text/css    "access plus 7 days"
  ExpiresByType application/javascript "access plus 7 days"
</IfModule>

<IfModule mod_headers.c>
  <FilesMatch "\.(webp|jpe?g|png)$">
    Header set Cache-Control "public, max-age=2592000, immutable"
  </FilesMatch>
  <FilesMatch "\.html$">
    Header set Cache-Control "no-cache"
  </FilesMatch>
</IfModule>

# Compressione del testo (l'HTML pesa 120 KB, compresso ~30 KB)
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml
</IfModule>
